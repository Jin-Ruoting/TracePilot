[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracepilot-agent"
version = "0.3.1"
description = "Evidence-backed code research with reproducible, bounded experiments."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["numpy==1.26.4", "scipy==1.12.0", "scikit-learn==1.6.1"]
plots = ["matplotlib==3.10.0"]

[project.scripts]
tracepilot = "tracepilot.cli:main"
tracepilot-runtime = "tracepilot.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]
