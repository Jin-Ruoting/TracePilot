name: TracePilot Quality Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show Python version
        run: python --version

      - name: Run TracePilot quality gate
        run: make check PYTHON=python

      - name: Write machine-readable gate and demo
        run: |
          make check-json PYTHON=python
          make demo PYTHON=python

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracepilot-quality-artifacts
          path: |
            traces/quality-gate-report.md
            traces/quality-gate-report.json
            traces/general-benchmark.md
            traces/general-benchmark.json
            traces/technical-decision-run.json
            traces/workbench.html
          if-no-files-found: warn
